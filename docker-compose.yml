version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: klem_site_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_klem
      MYSQL_DATABASE: klem_showcase_db
      MYSQL_USER: klem_user
      MYSQL_PASSWORD: klem_password
    ports:
      - "3306:3306"
    volumes:
      - klem_db_data:/var/lib/mysql

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klem_site_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html

volumes:
  klem_db_data:
