name: klem_ref_bot — ingestion planifiée (Trade-X)

# Job dédié planifié, distinct du pipeline CI principal (push/PR) — conforme à
# specifications_techniques.md §5 : "un job dédié planifié (scheduled) pour l'exécution
# périodique du script d'ingestion klem_ref_bot hors du service applicatif principal".
#
# Statut réel : l'étape d'ingestion réelle (`--douanes-ci-page 0`) est câblée ci-dessous, avec
# persistance du checkpoint de déduplication (klem_ref_bot/checkpoint.py, voir README) entre deux
# exécutions planifiées via actions/cache — un runner GitHub Actions est éphémère, le fichier ne
# survivrait pas d'un run à l'autre sans ça. Motif de la clé de cache unique par run
# (`klem-ref-bot-checkpoint-${{ github.run_id }}`) plutôt qu'une clé fixe : `actions/cache/save`
# refuse de réécrire une clé déjà existante (cache immuable côté GitHub) — la clé unique par run
# contourne ça, `restore-keys` (préfixe) retrouve la sauvegarde la plus récente au run suivant.
#
# Reste un point d'infrastructure hors de portée de ce dépôt : KLEM_REF_BOT_DATABASE_URL (secret
# DB du compte klem_ref_bot_ingestion à droits restreints, voir README "Provisionnement") doit être
# configuré dans les secrets GitHub Actions de ce dépôt — l'étape d'ingestion est gardée par
# `if: secrets.KLEM_REF_BOT_DATABASE_URL != ''` pour rester un no-op silencieux tant qu'il ne l'est
# pas, plutôt que d'échouer bruyamment à chaque run planifié.
on:
  schedule:
    - cron: "0 4 * * *" # quotidien, 04:00 UTC — cadence provisoire, à ajuster selon la fraîcheur
                         # réelle des sources institutionnelles une fois l'ingestion réelle en place
  workflow_dispatch: {} # déclenchement manuel pour vérification ponctuelle

jobs:
  klem-ref-bot-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/referentiel-api-service/ingestion/klem_ref_bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/referentiel-api-service/ingestion/klem_ref_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v

      - name: Restaurer les checkpoints de déduplication
        uses: actions/cache/restore@v4
        with:
          path: |
            services/referentiel-api-service/ingestion/klem_ref_bot/.state/douanes_ci_checkpoint.json
            services/referentiel-api-service/ingestion/klem_ref_bot/.state/commerce_gouv_ci_checkpoint.json
          key: klem-ref-bot-checkpoint-${{ github.run_id }}
          restore-keys: |
            klem-ref-bot-checkpoint-

      - name: Ingestion réelle — douanes.ci (page 0)
        if: ${{ secrets.KLEM_REF_BOT_DATABASE_URL != '' }}
        env:
          KLEM_REF_BOT_DATABASE_URL: ${{ secrets.KLEM_REF_BOT_DATABASE_URL }}
        run: python -m klem_ref_bot.main --douanes-ci-page 0

      - name: Ingestion réelle — commerce.gouv.ci (Lois/Arrêtés/Décrets)
        if: ${{ secrets.KLEM_REF_BOT_DATABASE_URL != '' }}
        env:
          KLEM_REF_BOT_DATABASE_URL: ${{ secrets.KLEM_REF_BOT_DATABASE_URL }}
        run: python -m klem_ref_bot.main --commerce-ci

      - name: Sauvegarder les checkpoints de déduplication
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            services/referentiel-api-service/ingestion/klem_ref_bot/.state/douanes_ci_checkpoint.json
            services/referentiel-api-service/ingestion/klem_ref_bot/.state/commerce_gouv_ci_checkpoint.json
          key: klem-ref-bot-checkpoint-${{ github.run_id }}
