name: klem_ref_bot — ingestion planifiée (Trade-X)

# Job dédié planifié, distinct du pipeline CI principal (push/PR) — conforme à
# specifications_techniques.md §5 : "un job dédié planifié (scheduled) pour l'exécution
# périodique du script d'ingestion klem_ref_bot hors du service applicatif principal".
#
# Statut réel : ce workflow exécute la suite de tests (garde-fou de non-régression) mais
# n'invoque PAS encore `python -m klem_ref_bot.main --douanes-ci-page N` en conditions réelles,
# bien que cette capacité existe et soit vérifiée manuellement de bout en bout — y compris la
# déduplication par checkpoint local (klem_ref_bot/checkpoint.py, voir README) qui empêche de
# reproposer les mêmes documents à chaque run. Deux points d'infrastructure restent avant
# d'activer une étape d'ingestion réelle ici :
#   1. KLEM_REF_BOT_DATABASE_URL (secret DB du compte klem_ref_bot_ingestion) n'est pas configuré
#      sur ce dépôt GitHub.
#   2. Le fichier de checkpoint (KLEM_REF_BOT_CHECKPOINT_PATH) doit persister entre deux exécutions
#      planifiées — un runner GitHub Actions est éphémère. Utiliser actions/cache/restore +
#      actions/cache/save autour de ce fichier une fois l'étape d'ingestion ajoutée ; ne pas
#      ajouter ces étapes de cache avant l'étape d'ingestion elle-même (cache non exploité sinon).
# Ne pas ajouter l'étape d'ingestion réelle avant que ces deux points soient résolus.
on:
  schedule:
    - cron: "0 4 * * *" # quotidien, 04:00 UTC — cadence provisoire, à ajuster selon la fraîcheur
                         # réelle des sources institutionnelles une fois l'ingestion réelle en place
  workflow_dispatch: {} # déclenchement manuel pour vérification ponctuelle

jobs:
  klem-ref-bot-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/referentiel-api-service/ingestion/klem_ref_bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/referentiel-api-service/ingestion/klem_ref_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v
