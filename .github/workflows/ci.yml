name: KLEM Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important pour que Turbo puisse comparer les commits et l'historique Git

      # ☕ Configuration de l'environnement Java — deux JDK côte à côte :
      # 17 pour cantine-connect/server-backend (encore sur cette version, voir ADR
      # 2026-08-08-adoption-directive-maitre-datasphere-perimetre.md), 21 (par défaut sur le
      # PATH, dernier de la liste) pour les nouveaux services KLEM DataSphere conformes à
      # KLEM_MASTER_SYSTEM_DIRECTIVE.md §3.1. Chaque JDK reste sélectionnable explicitement via
      # $JAVA_HOME_17_X64 / $JAVA_HOME_21_X64 dans les étapes de build ci-dessous.
      - name: Setup Java 17 & 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
          cache: 'maven'

      # 📦 Configuration de pnpm et Node.js (Pour Turborepo, le Web et le Mobile)
      # Version résolue depuis "packageManager" dans package.json (source unique) — ne pas
      # remettre de "version:" ici, pnpm/action-setup@v4 refuse la double spécification.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 📜 Test de validation des ADR (Vérification du dossier réel de KLEM)
      - name: Test de validation des ADR
        run: |
          TARGET_DIR="collaboration/history/adr"
          if [ ! -d "$TARGET_DIR" ] || [ -z "$(ls -A $TARGET_DIR)" ]; then
            echo "❌ Erreur : Aucun document ADR trouvé dans '$TARGET_DIR'."
            echo "Chaque évolution d'architecture doit être documentée. Utilisez ./scripts/create-adr.sh"
            exit 1
          fi
          echo "✅ Validation des ADR réussie."

      # 🚀 L'orchestration Turborepo (Compilation, Linters et Tests Unitaires en parallèle)
      # Ne couvre que les packages Node (chacun a son propre package.json) — les modules Maven
      # n'en ont pas et sont donc ignorés par Turbo. D'où les étapes Java dédiées ci-dessous.
      - name: Run Lint, Test and Build via Turborepo
        run: pnpm turbo run lint test build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }} # Requis si tu branches le Remote Cache de Vercel ou Turbo
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # ☕ Build & tests des modules Java (Maven, hors périmètre pnpm/Turborepo ci-dessus)
      - name: Build & Test — cantine-connect/server-backend (Java 17)
        working-directory: apps/web-app/cantine-connect/server-backend
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./mvnw -B clean verify

      - name: Build & Test — transit-ops-service (Java 21)
        working-directory: services/transit-ops-service
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./mvnw -B clean verify

      - name: Build & Test — referentiel-api-service (Java 21)
        working-directory: services/referentiel-api-service
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./mvnw -B clean verify