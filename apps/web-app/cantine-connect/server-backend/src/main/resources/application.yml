spring:
  application:
    name: cantine-connect-backend

  profiles:
    active: dev

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        default_batch_fetch_size: 50

  # ── Flyway (migrations versionnées) ──────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # ── Pagination par défaut ────────────────────────────────
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

  # ── Notifications Email (SMTP) ────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ── Upload de fichiers (ex. certificats médicaux) ────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ── Stockage local des fichiers uploadés ─────────────────
# ⚠️ Disque éphémère sur Railway — bascule S3-compatible à prévoir en phase 2
storage:
  uploads-dir: ${UPLOADS_DIR:uploads}

# ── Serveur ───────────────────────────────────────────────
# Railway injecte $PORT dynamiquement — fallback 8081 en local
server:
  port: ${PORT:8081}

# ── Actuator (Health Check) ───────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

# ── Paiements Mobile Money ───────────────────────────────
# ⚠️ Valeurs par défaut "*_test" non fonctionnelles — renseigner de vraies
# clés (comptes CinetPay/PayDunya) pour activer un paiement réel. Sans
# elles, l'appel API échoue proprement (message clair, pas de crash).
paiement:
  cinetpay:
    api-key: ${CINETPAY_API_KEY:cle_test}
    site-id: ${CINETPAY_SITE_ID:site_test}
    api-secret: ${CINETPAY_API_SECRET:secret_test}
    verify-signature: ${CINETPAY_VERIFY_SIGNATURE:false}
  paydunya:
    master-key: ${PAYDUNYA_MASTER_KEY:cle_test}
    private-key: ${PAYDUNYA_PRIVATE_KEY:cle_privee_test}
    public-key: ${PAYDUNYA_PUBLIC_KEY:cle_publique_test}
    token: ${PAYDUNYA_TOKEN:token_test}
    mode: ${PAYDUNYA_MODE:test}
    verify-signature: ${PAYDUNYA_VERIFY_SIGNATURE:false}
  orange-money:
    client-id: ${ORANGE_MONEY_CLIENT_ID:client_test}
    client-secret: ${ORANGE_MONEY_CLIENT_SECRET:secret_test}
    merchant-key: ${ORANGE_MONEY_MERCHANT_KEY:cle_marchand_test}
    webhook-secret: ${ORANGE_MONEY_WEBHOOK_SECRET:}
    verify-signature: ${ORANGE_MONEY_VERIFY_SIGNATURE:false}

# ── Contrat unifié multi-providers (PaymentStrategy) ──────
# Provider utilisé par défaut sur /api/v2/canteen-payments/initiate quand aucun
# provider explicite n'est fourni dans la requête. Valeurs possibles : voir
# com.klem.cantine.paiement.strategy.enums.PaymentProviderType.
klem:
  payment:
    default-provider: ${KLEM_PAYMENT_DEFAULT_PROVIDER:CINETPAY}

# ── URLs publiques (callbacks paiement, liens dans les notifications) ────
app:
  frontend-url: ${APP_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8081}

# ── SMS (Twilio) ──────────────────────────────────────────
# ⚠️ Sans identifiants, SmsNotificationSender bascule en mode journal
# (log-only) — comportement sûr par défaut, aucun crash.
sms:
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    # Numéro expéditeur WhatsApp Business Twilio (distinct du SMS from-number) —
    # voir WhatsAppNotificationSender / connexion parent par OTP.
    whatsapp-from-number: ${TWILIO_WHATSAPP_FROM_NUMBER:}
    # SID (HX...) du Content Template WhatsApp à variable unique {{1}} — requis par Twilio
    # pour tout message business-initiated (OTP), y compris en Sandbox après le "join".
    whatsapp-content-sid: ${TWILIO_WHATSAPP_CONTENT_SID:}

# ── JWT ───────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:cantine-connect-secret-key-dev-only-256bits-change-in-production!!}
  expiration-ms: 86400000  # 24 heures

# ── CORS ──────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

notification:
  from: ${NOTIFICATION_FROM_EMAIL:noreply@cantine-connect.ci}
  app-url: ${APP_URL:http://localhost:5173}

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.klem.cantine: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
# ════════════════════════════════════════════════════════════
# Profil : DEV (Docker Compose local)
# ════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/cantine_connect
    username: cantine_admin
    password: cantine_dev_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

---
# ════════════════════════════════════════════════════════════
# Profil : PROD (Variables d'environnement obligatoires)
# ════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

# Conteneur Railway limité à ~1 Go — le pool de threads Tomcat par défaut
# (200) réserve trop de mémoire (piles de threads) pour la charge réelle
# de cette application ; réduit à un niveau adapté à un petit établissement.
server:
  tomcat:
    threads:
      max: 50
      min-spare: 5

logging:
  level:
    com.klem.cantine: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
