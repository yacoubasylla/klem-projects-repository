<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C97D" />
      <stop offset="55%" stop-color="#F0A94A" />
      <stop offset="100%" stop-color="#E8720C" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="diamonds" width="88" height="88" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#B85400" fill-opacity="0.30" />
      <circle cx="54" cy="34" r="2" fill="#075A34" fill-opacity="0.28" />
      <path d="M0 44 L22 22 L44 44 L22 66 Z" fill="none" stroke="#A67D0F" stroke-opacity="0.32" stroke-width="1.5" />
      <circle cx="70" cy="70" r="3" fill="#B85400" fill-opacity="0.26" />
    </pattern>
  </defs>

  <rect width="900" height="900" fill="url(#bg)" />
  <rect width="900" height="900" fill="url(#diamonds)" />
  <rect width="900" height="900" fill="url(#glow)" />

  <!-- Bol chaud avec volutes de vapeur, silhouette minimaliste cohérente avec le motif géométrique -->
  <g transform="translate(450 330)" fill="none" stroke="#2B2118" stroke-opacity="0.92" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-120 0 C-120 66 -66 120 0 120 C66 120 120 66 120 0 Z" fill="#FFF3E0" fill-opacity="0.85" />
    <ellipse cx="0" cy="0" rx="120" ry="22" fill="#FFE1B8" fill-opacity="0.85" />
    <path d="M-96 20 C-96 60 -53 96 0 96 C53 96 96 60 96 20" stroke-opacity="0.5" />
  </g>
  <g stroke="#2B2118" stroke-opacity="0.75" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M400 260 C392 240 408 228 400 208" />
    <path d="M450 250 C442 228 458 216 450 196" />
    <path d="M500 260 C492 240 508 228 500 208" />
  </g>

  <!-- Fanion école, discret, en bas à gauche du cadrage -->
  <g transform="translate(150 540)" fill="none" stroke="#075A34" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 L0 140" />
    <path d="M0 10 L90 34 L0 58 Z" fill="#B85400" fill-opacity="0.85" />
  </g>
</svg>
