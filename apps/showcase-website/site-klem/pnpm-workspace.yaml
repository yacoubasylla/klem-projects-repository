# GHSA-mwcw-c2x4-8c55 (Dependabot #28) : nanoid < 3.3.17, tiré transitivement par postcss.
# GHSA-2v37-7h3g-55p8 (Dependabot #62, détectée 2026-08-13) : nanoid < 3.3.18 — boucle infinie
# possible si un générateur personnalisé reçoit une taille de 0. Pin relevé à 3.3.18.
# Pin patch-level (3.3.18, pas de plage ouverte) pour rester dans la ligne 3.3.x attendue par
# postcss@8 — un saut vers nanoid 6.x (majeur) casserait potentiellement son API.
overrides:
  nanoid: '3.3.18'
