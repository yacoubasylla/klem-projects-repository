spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/klem_core
    username: core_api
    password: core_api
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092

keycloak:
  admin:
    base-url: http://localhost:8080
    realm: klem-datasphere
    client-id: core-api-provisioning
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

logging:
  level:
    com.klem.coreapi: DEBUG
