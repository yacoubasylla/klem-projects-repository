spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klem_core}
    username: ${DB_USERNAME:core_api}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # N'embarque pas le nom de classe Java dans l'en-tête __TypeId__ — un consommateur d'un
        # autre langage/service ne connaît pas com.klem.coreapi.*, seul le JSON compte
        # (shared_architecture/data_pipeline/specifications_techniques.md §2.1, enveloppe portable).
        spring.json.add.type.headers: false

keycloak:
  admin:
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_ADMIN_REALM:klem-datasphere}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:core-api-provisioning}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
