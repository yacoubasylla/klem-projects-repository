spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/klem_core_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Résolution paresseuse (pas d'appel réseau au démarrage) — placeholder pour les tests
          # de contexte qui ne passent pas par le filtre OAuth2.
          issuer-uri: https://issuer.test.klem.local
  kafka:
    # Placeholder — les tests qui publient réellement (Testcontainers KafkaContainer) écrasent
    # cette valeur via @DynamicPropertySource, comme spring.datasource.url. Les slices @WebMvcTest
    # n'instancient pas KafkaTemplate (bean web-only exclu), cette valeur ne les concerne pas.
    bootstrap-servers: localhost:9092

keycloak:
  admin:
    # Même remarque que Kafka ci-dessus : KeycloakRoleSyncIntegrationTest écrase base-url/realm/
    # client-id/client-secret via @DynamicPropertySource contre un vrai conteneur Keycloak.
    base-url: http://localhost:8080
    realm: klem-datasphere-test
    client-id: core-api-provisioning
    client-secret: test-secret
