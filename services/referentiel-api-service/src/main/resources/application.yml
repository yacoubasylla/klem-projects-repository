spring:
  application:
    name: referentiel-api-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klem_trade_x}
    username: ${DB_USERNAME:referentiel_api}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: klem_trade_x
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    schemas: klem_trade_x
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # N'embarque pas le nom de classe Java dans l'en-tête __TypeId__ — un consommateur d'un
        # autre langage/service ne connaît pas com.klem.referentielapi.*, seul le JSON compte
        # (shared_architecture/data_pipeline/specifications_techniques.md §2.1, enveloppe portable,
        # même convention que core-api).
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
